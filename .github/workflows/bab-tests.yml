name: BAB research test and coverage gates

on:
  pull_request:
    branches: [main]
    paths:
      - "strategies/betting_against_beta/**"
      - "tests/**"
      - ".github/workflows/bab-tests.yml"
      - "requirements.txt"
  push:
    branches: [main]
    paths:
      - "strategies/betting_against_beta/**"
      - "tests/**"
      - ".github/workflows/bab-tests.yml"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  bab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pytest-cov
      - name: Enforce BAB coverage target
        env:
          PYTHONPATH: .
        run: >
          python -m pytest
          tests/test_betting_against_beta*.py
          tests/test_bab_*.py
          -q
          --cov=strategies.betting_against_beta
          --cov-report=term-missing
          --cov-fail-under=95
      - name: Run complete repository test suite
        env:
          PYTHONPATH: .
        run: python -m pytest -q
