name: "BAB MEXC $100 USDT PAPER ONLY — DAILY CLOSE / FIVE-MINUTE SNAPSHOTS"

run-name: "BAB MEXC paper cycle — ${{ github.event_name }} — run #${{ github.run_number }}"

on:
  push:
    branches: [main]
    paths:
      - ".github/activations/bab-paper-first-run-once"
  schedule:
    # Intended monitoring target: every five minutes. GitHub Actions scheduling
    # is best-effort and may start later during queueing or platform load.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bab-mexc-paper-state-single-writer
  cancel-in-progress: false

jobs:
  cycle:
    if: ${{ github.event_name != 'push' || contains(github.event.head_commit.message, '[BAB_PAPER_BOOTSTRAP]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MARKET_DATA_DIR: ../market-data
      PAPER_STATE_DIR: ../state
      # Resume universe bootstrap in bounded chunks; do not block snapshots
      # or daily decisions on one oversized invocation.
      BOOTSTRAP_BATCH_SIZE: "150"
      PYTHONUNBUFFERED: "1"
      PAPER_STATE_WRITE_ENABLED: "true"
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out BAB strategy repository
        uses: actions/checkout@v4
        with:
          ref: main
          path: strategy
          fetch-depth: 0
      - name: Check out proven MEXC paper execution engine
        uses: actions/checkout@v4
        with:
          repository: takenthatusernameis-collab/high-vs-low
          ref: main
          path: engine
          fetch-depth: 1
      - name: Check out persistent MEXC market-data branch
        uses: actions/checkout@v4
        with:
          ref: market-data
          path: market-data
          fetch-depth: 0
      - name: Check out immutable BAB paper-state branch
        uses: actions/checkout@v4
        with:
          ref: state
          path: state
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install BAB and MEXC engine dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e strategy
          python -m pip install -e engine
          python -m pip install pytest
      - name: Validate BAB signal ranking
        working-directory: strategy
        run: python -m pytest -q tests/test_bab_mexc_paper_cycle.py
      - name: Run daily-close decision or snapshot-only cycle
        id: cycle
        working-directory: strategy
        shell: bash
        timeout-minutes: 12
        run: |
          mkdir -p ../market-data/data/reports/mexc
          set -o pipefail
          python scripts/bab_mexc_paper_cycle.py | tee ../market-data/data/reports/mexc/bab-workflow-last-run.log
      - name: Commit MEXC public market data and research reports
        if: always()
        working-directory: market-data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/
          if git diff --cached --quiet; then
            echo "No public MEXC market-data changes."
          else
            git commit -m "Append BAB MEXC public market data and reports"
            git push origin HEAD:market-data
          fi
      - name: Refresh immutable state branch after paper cycle
        if: always()
        working-directory: state
        shell: bash
        run: |
          git fetch origin state
          git reset --hard FETCH_HEAD
      - name: Build BAB equal-exposure and inverse-volatility equity curves
        id: report
        if: always()
        working-directory: strategy
        env:
          PAPER_WORKFLOW_OUTCOME: ${{ steps.cycle.outcome }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python scripts/build_bab_paper_status.py
      - name: Publish compact BAB paper status to main
        if: always() && steps.report.outcome == 'success'
        shell: bash
        run: |
          git -C strategy config user.name "github-actions[bot]"
          git -C strategy config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git -C strategy fetch origin main
            git -C strategy checkout -B main origin/main
            git -C strategy add PAPER_STATUS.md PAPER_TRADE_JOURNAL.md equal_exposure_equity_curve.svg alternative_path_equity_curve.svg
            if git -C strategy diff --cached --quiet; then
              echo "BAB paper status unchanged."
              exit 0
            fi
            git -C strategy commit -m "Refresh BAB MEXC paper status [skip ci]"
            if git -C strategy push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent main update; retrying fast-forward publication."
          done
          echo "Unable to publish BAB status after three retries."
          exit 1
      - name: Fail when the paper cycle itself is blocked or failed
        if: always()
        env:
          CYCLE_OUTCOME: ${{ steps.cycle.outcome }}
        run: |
          if [ "$CYCLE_OUTCOME" != "success" ]; then
            echo "::error::BAB paper cycle did not complete successfully ($CYCLE_OUTCOME)."
            exit 1
          fi
      - name: Upload BAB paper status and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bab-mexc-100usdt-paper-status
          path: |
            market-data/data/reports/mexc/
            strategy/PAPER_STATUS.md
            strategy/PAPER_TRADE_JOURNAL.md
            strategy/equal_exposure_equity_curve.svg
            strategy/alternative_path_equity_curve.svg
          if-no-files-found: warn
          retention-days: 30
