[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-betting-against-beta"
version = "0.1.0"
description = "Controller infrastructure plus Betting Against Beta (BAB) strategy for crypto."
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
]

[project.scripts]
bab-example = "scripts.load_real_bab_example:main"

[tool.setuptools.packages.find]
include = ["strategies*", "scripts*"]

[tool.setuptools.package-data]
strategies = ["*.pyi", "*.py.typed"]
